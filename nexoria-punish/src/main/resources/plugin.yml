name: NexoriaPunish
version: '1.0.0'
main: dev.nexoria.punish.NexoriaPunishPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Moderation suite featuring bans, mutes, kicks, and persistent infraction logs."
website: https://modrinth.com/plugin/nexoria-punish
depend: [NexoriaCore]

commands:
  punish:
    description: Primary command entrypoint for NexoriaPunish
    permission: nexoria.punish.admin
    aliases: [nexoriapunish]
  ban:
    description: Permanently ban a player from the server
    permission: nexoria.punish.admin
  unban:
    description: Revoke a player ban
    permission: nexoria.punish.admin
  mute:
    description: Mute a player from chat
    permission: nexoria.punish.admin
  unmute:
    description: Unmute a player
    permission: nexoria.punish.admin
  kick:
    description: Kick a player from the server
    permission: nexoria.punish.admin

permissions:
  nexoria.punish.admin:
    description: Full administration and moderation privileges
    default: op
