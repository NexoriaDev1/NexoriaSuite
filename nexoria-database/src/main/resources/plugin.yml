name: NexoriaDatabase
version: '1.0.0'
main: dev.nexoria.database.NexoriaDatabasePlugin
api-version: '1.21'
prefix: NexoriaDatabase
author: NexoriaDev
description: Centralized SQLite and MySQL database pooling abstraction.
website: https://github.com/NexoriaDev1/NexoriaSuite
depend: [ NexoriaCore ]

commands:
  database:
    description: Inspect and manage database backend connections
    aliases: [ db ]
    permission: nexoria.database.admin

permissions:
  nexoria.database.admin:
    description: Full administration over database connections
    default: op
