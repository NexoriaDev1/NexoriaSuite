name: NexoriaVanish
version: '1.0.0'
main: dev.nexoria.vanish.NexoriaVanishPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Complete staff stealth system with player hiding, mob ignore, and silent operation."
website: https://modrinth.com/plugin/nexoria-vanish

dependencies:
  server:
    NexoriaCore:
      load: BEFORE
      required: true

commands:
  vanish:
    description: Toggle stealth vanish mode
    permission: nexoria.vanish.admin
    aliases: [v]

permissions:
  nexoria.vanish.admin:
    description: Full administration privileges for NexoriaVanish
    default: op
  nexoria.vanish.see:
    description: Allows seeing vanished staff members
    default: op
