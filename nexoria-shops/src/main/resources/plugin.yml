name: NexoriaShops
version: '1.0.0'
main: dev.nexoria.shops.NexoriaShopsPlugin
api-version: '1.21'
prefix: NexoriaShops
author: NexoriaDev
description: Dynamic GUI shop system with instant sell hand/all integration.
website: https://github.com/NexoriaDev1/NexoriaSuite
depend: [ NexoriaCore, Vault ]

commands:
  shop:
    description: Open the server shop GUI
    permission: nexoria.shops.use
  sell:
    description: Sell items from your hand or inventory
    permission: nexoria.shops.sell

permissions:
  nexoria.shops.use:
    description: Allows opening the shop GUI
    default: true
  nexoria.shops.sell:
    description: Allows selling items via command
    default: true
  nexoria.shops.admin:
    description: Allows reloading the shop configuration
    default: op
