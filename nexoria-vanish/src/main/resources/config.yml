# NexoriaVanish Configuration File
# Ecosystem: NexoriaSuite (Paper / Purpur / Folia 1.21.x - 26.3)
# Java: 25+

general:
  enabled: true
  debug-mode: false

vanish:
  # Hide vanished players from tab list
  hide-from-tab: true
  # Prevent mob targetting while vanished
  prevent-mob-targeting: true
  # Prevent picking up items while vanished
  prevent-item-pickup: true

messages:
  prefix: "&8[&8NexoriaVanish&8] "
  no-permission: "&cYou lack the required permissions to execute this command."
  reloaded: "&aVanish configuration successfully reloaded."
  now-vanished: "&7You are now &aVanished &7(Hidden from normal players)."
  no-longer-vanished: "&7You are no longer &cVanished &7(Visible to everyone)."
  status-vanished: "&eVanished Players (&f{count}&e): &7{players}"
  no-one-vanished: "&7No players are currently vanished."
  only-player: "&cThis command can only be executed by in-game players."
