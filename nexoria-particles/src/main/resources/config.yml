# NexoriaParticles Configuration
# Cosmetic particle effects and player trails

settings:
  # Update interval in ticks for particle animations
  animation-interval-ticks: 3
  # Disabled worlds where cosmetic particles will not render
  disabled-worlds:
    - disabled_world_example

effects:
  halo:
    particle: "FLAME"
    offset-y: 2.1
    radius: 0.35
    count: 10
  wings:
    particle: "SOUL_FIRE_FLAME"
    count: 16
  trail:
    particle: "CHERRY_LEAVES"
    count: 3
  orbit:
    particle: "END_ROD"
    radius: 0.9
    count: 2

messages:
  prefix: "&8[&dParticles&8] &r"
  applied: "&aActive effect set to: &e{effect}&a."
  cleared: "&aCosmetic particles cleared."
  invalid-effect: "&cInvalid effect. Available: &ehalo, wings, trail, orbit, clear&c."
  reloaded: "&aParticles configuration reloaded successfully."
  no-permission: "&cYou do not have permission to execute this command."
