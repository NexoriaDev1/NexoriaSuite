name: NexoriaNBT
version: '1.0.0'
main: dev.nexoria.nbt.NexoriaNBTPlugin
api-version: '1.21'
prefix: NexoriaNBT
author: NexoriaDev
description: PersistentDataContainer inspection and manipulation framework.
website: https://github.com/NexoriaDev1/NexoriaSuite
depend: [ NexoriaCore ]

commands:
  nbt:
    description: Inspect and modify PersistentDataContainer tags on items
    aliases: [ pdc ]
    permission: nexoria.nbt.admin

permissions:
  nexoria.nbt.admin:
    description: Full administration over item PDC tags
    default: op
