name: NexoriaSync
version: '1.0.0'
main: dev.nexoria.sync.NexoriaSyncPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Real-time Redis cross-server synchronization for inventories, enderchests, and player statistics."
website: https://modrinth.com/plugin/nexoria-sync

commands:
  sync:
    description: Primary command entrypoint for NexoriaSync
    permission: nexoria.sync.use
    aliases: [sync]

permissions:
  nexoria.sync.admin:
    description: Full administration privileges for NexoriaSync
    default: op
  nexoria.sync.use:
    description: Standard player privileges for NexoriaSync
    default: true
