# NexoriaDatabase Configuration
# Central database connection pool for NexoriaSuite

storage:
  # Storage type: SQLITE or MYSQL
  type: "SQLITE"
  
  # SQLite options
  sqlite:
    file: "data/storage.db"
    
  # MySQL / MariaDB options
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: ""
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout-ms: 10000

messages:
  prefix: "&8[&1Database&8] &r"
  connected: "&aSuccessfully established database connection."
  failed: "&cFailed to establish database connection: {error}"
  status: "&7Database backend: &e{type} &7| Status: {status}"
  reloaded: "&aDatabase configuration and pools reloaded."
  no-permission: "&cYou do not have permission to execute this command."
