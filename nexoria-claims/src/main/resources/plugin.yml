name: NexoriaClaims
version: '1.0.0'
main: dev.nexoria.claims.NexoriaClaimsPlugin
api-version: '1.21'
description: Chunk-based land claims and territory protection
author: NexoriaDev
softdepend: [ NexoriaCore ]
commands:
  claim:
    description: Claim current chunk
    aliases: [ landclaim ]
  unclaim:
    description: Unclaim current chunk
  trust:
    description: Trust player in claims
  untrust:
    description: Untrust player in claims
  claimadmin:
    description: Claims administrative commands
    aliases: [ cadmin ]
    permission: nexoria.claims.admin
permissions:
  nexoria.claims.use:
    description: Allows claiming land
    default: true
  nexoria.claims.admin:
    description: Administrative bypass and unclaim
    default: op
  nexoria.claims.admin.bypass:
    description: Bypass claim protection
    default: op
