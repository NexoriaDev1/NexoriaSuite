name: NexoriaSync
version: '1.0.0'
main: dev.nexoria.sync.NexoriaSyncPlugin
api-version: '1.21'
description: Cross-server inventory and player state synchronization
author: NexoriaDev
softdepend: [ NexoriaCore ]
commands:
  sync:
    description: Synchronize player state across network
    aliases: [ playersync, psync ]
    permission: nexoria.sync.admin
permissions:
  nexoria.sync.admin:
    description: Allows managing player network sync
    default: op
