# NexoriaAntiGrief Configuration
# Comprehensive server protection against explosions, fire, trampling and griefing

protections:
  # Block creeper explosions from damaging terrain
  block-creeper-damage: true
  # Block TNT explosions from damaging terrain
  block-tnt-damage: false
  # Block wither & wither skull projectile explosions
  block-wither-damage: true
  # Block end crystal explosions from breaking blocks
  block-crystal-damage: true
  # Block bed / respawn anchor explosions in nether/end
  block-bed-anchor-damage: true
  # Stop fire from spreading to neighboring flammable blocks
  block-fire-spread: true
  # Stop fire from burning and destroying blocks
  block-fire-burn: true
  # Prevent players and mobs from trampling farmland crops
  block-crop-trample: true
  # Prevent Endermen from picking up or placing blocks
  block-enderman-grief: true
  # Prevent Ravagers from breaking leaves and crops
  block-ravager-grief: true

messages:
  prefix: "&8[&9AntiGrief&8] &r"
  toggle-status: "&7Protection &e{feature} &7is now &f{status}&7."
  status-header: "&9AntiGrief Active Protections:"
  reloaded: "&aAntiGrief configuration reloaded successfully."
  no-permission: "&cYou do not have permission to execute this command."
