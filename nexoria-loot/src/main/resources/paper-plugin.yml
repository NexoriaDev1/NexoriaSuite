name: NexoriaLoot
version: '1.0.0'
main: dev.nexoria.loot.NexoriaLootPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Custom dungeon chest, mob drop, and fishing loot table manager with weight percentages."
website: https://modrinth.com/plugin/nexoria-loot

commands:
  loot:
    description: Primary command entrypoint for NexoriaLoot
    permission: nexoria.loot.use
    aliases: [loot]

permissions:
  nexoria.loot.admin:
    description: Full administration privileges for NexoriaLoot
    default: op
  nexoria.loot.use:
    description: Standard player privileges for NexoriaLoot
    default: true
