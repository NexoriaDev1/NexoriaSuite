name: NexoriaHolograms
version: '1.0.0'
main: dev.nexoria.holograms.NexoriaHologramsPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Modern Display-Entity text and item hologram manager with zero armor stand tick overhead."
website: https://modrinth.com/plugin/nexoria-holograms

commands:
  hologram:
    description: Primary command entrypoint for NexoriaHolograms
    permission: nexoria.holograms.use
    aliases: [holograms]

permissions:
  nexoria.holograms.admin:
    description: Full administration privileges for NexoriaHolograms
    default: op
  nexoria.holograms.use:
    description: Standard player privileges for NexoriaHolograms
    default: true
