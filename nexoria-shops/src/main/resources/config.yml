# NexoriaShops Configuration
# Server GUI shop and sell engine hooking into Vault & NexoriaEconomy

settings:
  # Title for the main shop menu
  main-menu-title: "&8Server Shop"
  # Size of the main shop GUI (multiple of 9, max 54)
  main-menu-size: 27
  # Category GUI size
  category-menu-size: 36

# Categories displayed in the main menu
categories:
  blocks:
    name: "&a&lBuilding Blocks"
    icon: STONE
    slot: 10
    lore:
      - "&7Click to browse stone, wood,"
      - "&7and decorative building blocks."
  farming:
    name: "&e&lFarming & Crops"
    icon: WHEAT
    slot: 12
    lore:
      - "&7Click to browse crops,"
      - "&7seeds and organic produce."
  ores:
    name: "&b&lMinerals & Ores"
    icon: DIAMOND
    slot: 14
    lore:
      - "&7Click to browse precious metals,"
      - "&7gems, and mining resources."
  mob_drops:
    name: "&c&lMonster Drops"
    icon: ROTTEN_FLESH
    slot: 16
    lore:
      - "&7Click to browse loot collected"
      - "&7from hostile mobs and bosses."

# Items available in each category
# buy: price to buy from shop (-1 to disable buying)
# sell: price to sell to shop (-1 to disable selling)
