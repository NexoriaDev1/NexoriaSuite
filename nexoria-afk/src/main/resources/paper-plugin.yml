name: NexoriaAFK
version: '1.0.0'
main: dev.nexoria.afk.NexoriaAFKPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Intelligent AFK tracking engine with movement detection, tab prefixes, and inactivity management."
website: https://modrinth.com/plugin/nexoria-afk

dependencies:
  server:
    NexoriaCore:
      load: BEFORE
      required: true

commands:
  afk:
    description: Toggle your AFK status or inspect server idle players
    permission: nexoria.afk.use
    aliases: [away]

permissions:
  nexoria.afk.admin:
    description: Full administration privileges for NexoriaAFK
    default: op
  nexoria.afk.use:
    description: Standard player privileges to toggle AFK
    default: true
  nexoria.afk.bypass.kick:
    description: Bypass idle auto-kick
    default: op
