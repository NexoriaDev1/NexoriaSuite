name: NexoriaParticles
version: '1.0.0'
main: dev.nexoria.particles.NexoriaParticlesPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Mathematical 3D particle animations, wings, auras, and projectile trails framework."
website: https://modrinth.com/plugin/nexoria-particles

commands:
  particles:
    description: Primary command entrypoint for NexoriaParticles
    permission: nexoria.particles.use
    aliases: [particles]

permissions:
  nexoria.particles.admin:
    description: Full administration privileges for NexoriaParticles
    default: op
  nexoria.particles.use:
    description: Standard player privileges for NexoriaParticles
    default: true
