# NexoriaCombat Configuration
# Anti-combat log and competitive PvP management engine

settings:
  # Combat tag duration in seconds
  combat-tag-seconds: 15
  # Enable action bar countdown timer while tagged
  actionbar-timer: true
  actionbar-format: "&cIn combat: &e{time}s &7| &cDo not disconnect!"
  # Kill players who disconnect while in combat
  kill-on-logout: true
  # Broadcast when a player logs out during combat
  broadcast-logout: true
  # Enderpearl cooldown in seconds (0 to disable)
  enderpearl-cooldown-seconds: 10
  # Block elytra gliding while combat tagged
  block-elytra: true

# Commands completely blocked while tagged
blocked-commands:
  - "/spawn"
  - "/home"
  - "/tpa"
  - "/tpaccept"
  - "/tpahere"
  - "/warp"
  - "/rtp"
  - "/back"
  - "/fly"
  - "/heal"
  - "/feed"
  - "/pay"
  - "/trade"

messages:
  prefix: "&8[&cCombat&8] &r"
  tagged: "&cYou are now in combat with &e{enemy}&c! Do not disconnect for &e{time}s&c!"
  tag-expired: "&aYou are no longer in combat."
  command-blocked: "&cYou cannot execute &e{command} &cwhile engaged in combat!"
  enderpearl-cooldown: "&cEnderpearl is on cooldown: &e{time}s &cremaining."
  logout-broadcast: "&c{player} logged out while fighting {enemy} and was killed!"
  status-tagged: "&cYou are currently in combat for &e{time}s&c."
  status-safe: "&aYou are not in combat."
  untagged-player: "&aRemoved {player} from combat."
  reloaded: "&aCombat configuration reloaded successfully."
  no-permission: "&cYou do not have permission to execute this command."
