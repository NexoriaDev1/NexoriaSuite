name: NexoriaChat
version: '1.0.0'
main: dev.nexoria.chat.NexoriaChatPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Channel-based modern chat formatter with mention sounds, swear filters, and anti-spam protection."
website: https://modrinth.com/plugin/nexoria-chat

dependencies:
  server:
    NexoriaCore:
      load: BEFORE
      required: true

commands:
  chat:
    description: Primary command entrypoint for NexoriaChat
    permission: nexoria.chat.use
    aliases: [nexoriachat]

permissions:
  nexoria.chat.admin:
    description: Full administration privileges for NexoriaChat
    default: op
  nexoria.chat.use:
    description: Standard player privileges for NexoriaChat
    default: true
  nexoria.chat.bypass.cooldown:
    description: Bypass chat rate limiting / cooldown
    default: op
  nexoria.chat.bypass.filter:
    description: Bypass blocked word filter
    default: op
  nexoria.chat.color:
    description: Allows using color codes in chat messages
    default: op
