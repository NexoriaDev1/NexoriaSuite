# NexoriaHolograms Configuration
# Ultra-lightweight floating holograms engine using modern Text Display entities

settings:
  # Line spacing between lines (in blocks, recommended 0.25 - 0.3)
  line-spacing: 0.28
  # Default text billboard mode: CENTER (always faces camera), FIXED, VERTICAL, HORIZONTAL
  billboard: "CENTER"
  # Default view distance in blocks
  view-distance: 48
  # Save hologram modifications immediately to disk
  autosave: true

messages:
  prefix: "&8[&eHolo&8] &r"
  created: "&aHologram &e{name} &acreated at your location."
  deleted: "&aHologram &e{name} &adeleted successfully."
  line-added: "&aAdded line to hologram &e{name}&a."
  line-set: "&aUpdated line &e#{index} &aof hologram &e{name}&a."
  moved: "&aHologram &e{name} &amoved to your current location."
  not-found: "&cHologram not found: &e{name}&c."
  already-exists: "&cA hologram named &e{name} &calready exists!"
  no-holograms: "&7No holograms are currently created."
  reloaded: "&aHologram configuration and data reloaded."
  no-permission: "&cYou do not have permission to execute this command."
