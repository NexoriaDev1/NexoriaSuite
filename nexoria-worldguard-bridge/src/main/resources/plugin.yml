name: NexoriaWorldguardBridge
version: '1.0.0'
main: dev.nexoria.worldguard.NexoriaWorldGuardBridgePlugin
api-version: '1.21'
description: Seamless WorldGuard and WorldEdit region protection bridge
author: NexoriaDev
softdepend: [ NexoriaCore, WorldGuard ]
commands:
  wgbridge:
    description: WorldGuard bridge diagnostics
    aliases: [ worldguardbridge, wgb ]
    permission: nexoria.worldguard.admin
permissions:
  nexoria.worldguard.admin:
    description: Allows accessing WorldGuard bridge diagnostics
    default: op
