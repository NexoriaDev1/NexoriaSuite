# NexoriaChat Configuration File
# Ecosystem: NexoriaSuite (Paper / Purpur / Folia 1.21.x - 26.3)
# Java: 25+

general:
  enabled: true
  debug-mode: false

chat:
  # Available placeholders: {player}, {displayname}, {message}, {world}
  format: "&7{player}&8: &f{message}"
  cooldown-seconds: 1.5

filter:
  enabled: true
  replacement: "***"
  blocked-words:
    - "fuck"
    - "bitch"
    - "asshole"
    - "shit"
    - "cunt"

mentions:
  enabled: true
  highlight-color: "&b@"
  sound: "entity.experience_orb.pickup"

messages:
  prefix: "&8[&dNexoriaChat&8] "
  no-permission: "&cYou lack the required permissions to execute this command."
  reloaded: "&aConfiguration and filters successfully reloaded."
  chat-muted: "&cGlobal chat has been muted by staff."
  chat-unmuted: "&aGlobal chat has been unmuted."
  chat-is-muted: "&cGlobal chat is currently muted."
  chat-cleared: "&eChat was cleared by &f{player}&e."
  cooldown: "&cPlease wait &e{seconds}s &cbefore sending another message."
  word-filtered: "&cYour message contained prohibited language."
