name: NexoriaAnnouncer
version: '1.0.0'
main: dev.nexoria.announcer.NexoriaAnnouncerPlugin
api-version: '1.21'
prefix: NexoriaAnnouncer
author: NexoriaDev
description: Automated announcement system with chat, title and actionbar broadcasts.
website: https://github.com/NexoriaDev1/NexoriaSuite
depend: [ NexoriaCore ]

commands:
  announcer:
    description: Manage announcements and reload configuration
    permission: nexoria.announcer.admin
  broadcast:
    description: Broadcast a custom message to all players
    aliases: [ bc ]
    permission: nexoria.announcer.broadcast

permissions:
  nexoria.announcer.admin:
    description: Allows managing announcements and reloading
    default: op
  nexoria.announcer.broadcast:
    description: Allows sending manual server-wide broadcasts
    default: op
