name: NexoriaRTP
version: '1.0.0'
main: dev.nexoria.rtp.NexoriaRTPPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Asynchronous, multi-threaded random wilderness teleporter with safe block checks and Folia chunk load safety."
website: https://modrinth.com/plugin/nexoria-rtp

dependencies:
  server:
    NexoriaCore:
      load: BEFORE
      required: true

commands:
  rtp:
    description: Teleport randomly into the wilderness
    permission: nexoria.rtp.use
    aliases: [wild, wilderness]

permissions:
  nexoria.rtp.admin:
    description: Full administration privileges for NexoriaRTP
    default: op
  nexoria.rtp.use:
    description: Standard player privileges to random teleport
    default: true
  nexoria.rtp.bypass.cooldown:
    description: Bypass random teleport cooldowns
    default: op
