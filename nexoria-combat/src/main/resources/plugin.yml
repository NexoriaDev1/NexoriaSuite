name: NexoriaCombat
version: '1.0.0'
main: dev.nexoria.combat.NexoriaCombatPlugin
api-version: '1.21'
prefix: NexoriaCombat
author: NexoriaDev
description: Anti-combat log, tag tracking, and competitive PvP control.
website: https://github.com/NexoriaDev1/NexoriaSuite
depend: [ NexoriaCore ]

commands:
  combat:
    description: Check combat status or manage combat tags
    aliases: [ ct, combattag ]
    permission: nexoria.combat.use

permissions:
  nexoria.combat.use:
    description: Allows checking combat status
    default: true
  nexoria.combat.bypass:
    description: Bypass combat tagging restrictions
    default: op
  nexoria.combat.admin:
    description: Allows untagging players and reloading configuration
    default: op
