name: NexoriaRTP
version: '1.0.0'
main: dev.nexoria.rtp.NexoriaRTPPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Asynchronous, multi-threaded random wilderness teleporter with biome filters and Folia chunk load safety."
website: https://modrinth.com/plugin/nexoria-rtp

commands:
  rtp:
    description: Primary command entrypoint for NexoriaRTP
    permission: nexoria.rtp.use
    aliases: [rtp]

permissions:
  nexoria.rtp.admin:
    description: Full administration privileges for NexoriaRTP
    default: op
  nexoria.rtp.use:
    description: Standard player privileges for NexoriaRTP
    default: true
