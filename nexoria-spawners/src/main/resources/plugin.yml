name: NexoriaSpawners
version: '1.0.0'
main: dev.nexoria.spawners.NexoriaSpawnersPlugin
api-version: '1.21'
prefix: NexoriaSpawners
author: NexoriaDev
description: Silk touch spawner collection, placement and egg management.
website: https://github.com/NexoriaDev1/NexoriaSuite
depend: [ NexoriaCore ]

commands:
  spawner:
    description: Manage and distribute mob spawners
    permission: nexoria.spawners.admin

permissions:
  nexoria.spawners.mine:
    description: Allows collecting spawners with Silk Touch
    default: true
  nexoria.spawners.change:
    description: Allows changing spawner entity type using spawn eggs
    default: true
  nexoria.spawners.admin:
    description: Full administration over spawners and commands
    default: op
