# NexoriaCooldowns Configuration
# Persistent cooldown management engine for commands and player actions

settings:
  # Enable actionbar alerts when attempting an action on cooldown
  notify-actionbar: true
  # Save cooldown data to disk every X seconds (0 to save on shutdown only)
  autosave-seconds: 180

# Command cooldown rules
# Format: <command>: <duration_in_seconds>
commands:
  feed: 60
  heal: 180
  repair: 300
  fix: 300
  fly: 30
  near: 45
  suicide: 120

messages:
  prefix: "&8[&3Cooldowns&8] &r"
  on-cooldown: "&cYou must wait &e{time} &cbefore using &e/{command} &cagain!"
  on-cooldown-actionbar: "&c/{command} &7on cooldown: &e{time} remaining"
  cooldown-reset: "&aReset cooldowns for player &e{player}&a."
  no-active-cooldowns: "&aPlayer &e{player} &ahas no active cooldowns."
  reloaded: "&aCooldowns configuration reloaded successfully."
  no-permission: "&cYou do not have permission to execute this command."
