name: NexoriaCustomCraft
version: '1.0.0'
main: dev.nexoria.customcraft.NexoriaCustomCraftPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Dynamic recipe engine supporting shaped, shapeless, furnace, and smithing custom recipes."
website: https://modrinth.com/plugin/nexoria-customcraft

commands:
  customcraft:
    description: Primary command entrypoint for NexoriaCustomCraft
    permission: nexoria.customcraft.use
    aliases: [customcraft]

permissions:
  nexoria.customcraft.admin:
    description: Full administration privileges for NexoriaCustomCraft
    default: op
  nexoria.customcraft.use:
    description: Standard player privileges for NexoriaCustomCraft
    default: true
