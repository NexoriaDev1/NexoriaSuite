# NexoriaMetrics Configuration
# Performance diagnostics and TPS/MSPT monitor for Paper and Folia

settings:
  # Enable color-coded TPS alerts in diagnostic report
  color-code-tps: true
  # Interval for automatic logging of server performance (0 to disable)
  auto-log-interval-minutes: 0

messages:
  prefix: "&8[&aMetrics&8] &r"
  gc-executed: "&aRequested JVM garbage collection."
  reloaded: "&aMetrics configuration reloaded successfully."
  no-permission: "&cYou do not have permission to execute this command."
