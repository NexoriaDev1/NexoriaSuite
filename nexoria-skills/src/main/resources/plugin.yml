name: NexoriaSkills
version: '1.0.0'
main: dev.nexoria.skills.NexoriaSkillsPlugin
api-version: '1.21'
description: Progression system featuring Mining, Woodcutting, Farming, Combat, and Fishing
author: NexoriaDev
softdepend: [ NexoriaCore ]
commands:
  skills:
    description: View and manage player skills
    aliases: [ skill, sk ]
permissions:
  nexoria.skills.use:
    description: Allows viewing and leveling skills
    default: true
  nexoria.skills.admin:
    description: Allows administering skills
    default: op
