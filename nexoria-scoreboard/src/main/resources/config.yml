# NexoriaScoreboard Configuration
# High-performance, flicker-free sidebar for Paper, Purpur, and Folia

settings:
  # How often the scoreboard updates (in ticks, 20 ticks = 1 second)
  update-interval: 20
  # Disabled worlds where scoreboard will not display
  disabled-worlds:
    - disabled_world_example

# Title animation (cycles through frames)
title:
  interval: 10
  frames:
    - "&6&lNEXORIA &f&lNETWORK"
    - "&e&lNEXORIA &f&lNETWORK"
    - "&f&lNEXORIA &6&lNETWORK"

# Scoreboard lines (top to bottom, max 15 lines)
# Available placeholders:
# %player%, %displayname%, %ping%, %health%, %max_health%,
# %balance%, %online%, %max_players%, %world%
lines:
  - "&7&m--------------------"
  - "&fPlayer: &a%player%"
  - "&fPing: &a%ping%ms"
  - ""
  - "&fEconomy:"
  - " &7Balance: &e$%balance%"
  - ""
  - "&fServer:"
  - " &7Online: &b%online%&7/%max_players%"
  - " &7World: &f%world%"
  - ""
  - "&eplay.nexoriamc.net"
  - "&7&m--------------------"

messages:
  prefix: "&8[&bScoreboard&8] &r"
  toggled-on: "&aScoreboard is now visible."
  toggled-off: "&cScoreboard is now hidden."
  reloaded: "&aConfiguration successfully reloaded."
  no-permission: "&cYou do not have permission to execute this command."
