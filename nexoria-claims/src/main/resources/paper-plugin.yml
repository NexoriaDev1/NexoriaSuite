name: NexoriaClaims
version: '1.0.0'
main: dev.nexoria.claims.NexoriaClaimsPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Lightweight chunk and visual polygon territory protection with trust permissions and flag editor."
website: https://modrinth.com/plugin/nexoria-claims

commands:
  claim:
    description: Primary command entrypoint for NexoriaClaims
    permission: nexoria.claims.use
    aliases: [claims]

permissions:
  nexoria.claims.admin:
    description: Full administration privileges for NexoriaClaims
    default: op
  nexoria.claims.use:
    description: Standard player privileges for NexoriaClaims
    default: true
