name: NexoriaWarps
version: '1.0.0'
main: dev.nexoria.warps.NexoriaWarpsPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "High-performance warp, home, and spawn manager with safe teleportation and permission nodes."
website: https://modrinth.com/plugin/nexoria-warps
depend: [NexoriaCore]

commands:
  warp:
    description: Teleport to server warps or inspect available destinations
    permission: nexoria.warps.use
    aliases: [warps]
  setwarp:
    description: Create a new server warp at current location
    permission: nexoria.warps.admin
  delwarp:
    description: Delete an existing server warp
    permission: nexoria.warps.admin

permissions:
  nexoria.warps.admin:
    description: Full administration privileges for NexoriaWarps (set, delete, reload)
    default: op
  nexoria.warps.use:
    description: Standard player privileges to list and use warps
    default: true
  nexoria.warps.bypass.cooldown:
    description: Bypass warp teleport cooldowns
    default: op
