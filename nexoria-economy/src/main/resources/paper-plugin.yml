name: NexoriaEconomy
version: '1.0.0'
main: dev.nexoria.economy.NexoriaEconomyPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Lightweight and fast economy solution with Vault provider support."
website: https://modrinth.com/plugin/nexoria-economy

dependencies:
  server:
    Vault:
      load: BEFORE
      required: false

commands:
  balance:
    description: Check your balance or another player's balance
    permission: nexoria.economy.use
    aliases: [bal, money]
  pay:
    description: Send money to another player
    permission: nexoria.economy.pay
  balancetop:
    description: View the top richest players
    permission: nexoria.economy.use
    aliases: [baltop]
  economy:
    description: Admin economy management command
    permission: nexoria.economy.admin
    aliases: [eco]

permissions:
  nexoria.economy.use:
    description: Allows checking balance and baltop
    default: true
  nexoria.economy.pay:
    description: Allows sending money to others
    default: true
  nexoria.economy.admin:
    description: Allows giving, taking, setting, and resetting player balances
    default: op
