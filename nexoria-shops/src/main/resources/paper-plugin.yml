name: NexoriaShops
version: '1.0.0'
main: dev.nexoria.shops.NexoriaShopsPlugin
api-version: '1.21'
folia-supported: true
author: NexoriaStudio
description: "Chest shop creation and virtual GUI marketplace with supply-demand dynamic pricing."
website: https://modrinth.com/plugin/nexoria-shops

commands:
  shop:
    description: Primary command entrypoint for NexoriaShops
    permission: nexoria.shops.use
    aliases: [shops]

permissions:
  nexoria.shops.admin:
    description: Full administration privileges for NexoriaShops
    default: op
  nexoria.shops.use:
    description: Standard player privileges for NexoriaShops
    default: true
