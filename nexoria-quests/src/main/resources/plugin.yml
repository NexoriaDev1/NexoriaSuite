name: NexoriaQuests
version: '1.0.0'
main: dev.nexoria.quests.NexoriaQuestsPlugin
api-version: '1.21'
description: Player quest tracking with progressive rewards
author: NexoriaDev
softdepend: [ NexoriaCore, Vault ]
commands:
  quests:
    description: Quests menu and progress tracker
    aliases: [ quest, q ]
permissions:
  nexoria.quests.use:
    description: View quests and receive rewards
    default: true
  nexoria.quests.admin:
    description: Reload and administer quests
    default: op
